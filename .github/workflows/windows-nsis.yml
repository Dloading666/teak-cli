name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'Web-Home/**'
      - 'screenshot/**'
      - 'README.md'

permissions:
  contents: read
  actions: write

jobs:
  nsis:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src-ui/package-lock.json

      - name: Install frontend deps
        run: |
          cd src-ui
          npm ci

      - name: Build frontend
        run: |
          cd src-ui
          npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: windows-nsis

      - name: Build NSIS installer
        shell: bash
        run: ./src-ui/node_modules/.bin/tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Coffee-CLI-windows-x64-setup
          path: |
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
